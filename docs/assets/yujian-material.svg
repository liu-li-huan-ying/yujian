crosoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif">导出为 PDF</text><text x="700" y="226" font-size="14" fill="#E8E9E7" text-anchor="end" font-weight="500" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif">② 浮层 = 玻璃（实时模糊，仅小面积浮层）</text><rect x="0" y="300" width="1080" height="130" fill="#1C1E1F"/><rect x="40" y="324" width="1000" height="82" fill="rgba(255,255,255,0.02)" rx="8"/><text x="60" y="364" font-size="14" fill="#A3A7A5" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif">正文 16px / 行高 1.75 · 内容列 720 居中 · 纯净实色不加纹理</text><text x="700" y="376" font-size="14" fill="#E8E9E7" text-anchor="end" font-weight="500" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif">③ 内容层 = 纯净实色（保对比度与导出一致）</text></svg>