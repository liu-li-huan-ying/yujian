name: CI

# 为什么加这一层：release.yml 只在打 tag 时跑（且只做打包），
# 日常提交没有任何自动门禁——typecheck / lint / 测试全靠人手跑，
# 一旦忘记就是「静默回归」。这个 workflow 把门禁钉在 PR 与 main 上。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # CI 使用官方镜像源，不受仓库内 .npmrc 的 npmmirror 影响
          npm_config_registry: https://registry.npmjs.org/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check text encoding (no U+FFFD)
        run: npm run check:encoding

      - name: Test (core logic)
        run: npm test

      - name: Verify markdown round-trip
        run: npm run verify:md

      - name: Verify markdown corpus (byte-exact round-trip)
        run: npm run verify:corpus

      # 防劣化：巨石文件复发 / any 逃逸越界与回涨 / 遗留标记
      - name: Structure health
        run: npm run check:structure

      - name: Index performance baseline
        run: npm run perf:index

      - name: Build (main / preload / renderer)
        run: npm run build

      # 「打开不写盘」红线：Crepe 序列化是破坏性的，只要「打开」被误判成「编辑」，
      # 自动保存就会把规范化后的文本写回磁盘，且坏内容即刻成为新的磁盘原文、无法自愈。
      # 单元测试用的是桩，跑不到真实 Crepe/ProseMirror，故由真启动应用、真比字节的 E2E 来守。
      #
      # 必须先确保 Electron 二进制就位：`npm ci` 在缓存命中时**不会**重新下载二进制
      # （实测整步仅 10s，而二进制约 100MB，明显没下），跑 E2E 会直接「找不到 electron」。
      # install.js 自身幂等：已就位时秒退，缺失时才下载。
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # Linux 无显示器 → 用 xvfb 提供虚拟 X。
      - name: E2E — open must not write (byte-exact)
        run: xvfb-run -a --server-args="-screen 0 1400x1000x24" node scripts/e2e-open-no-write.mjs --rounds=2
        env:
          MD_EDITOR_COMPAT_MODE: '1'
