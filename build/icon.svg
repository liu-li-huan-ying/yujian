<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74C1B7"/>
      <stop offset="0.52" stop-color="#3E918A"/>
      <stop offset="1" stop-color="#247064"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.30" cy="0.20" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0a2723" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 玉质圆角 tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#jade)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>
  <!-- 顶部内高光：玉的釉面感 -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none"
        stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- 笔记（笺）slip -->
  <g filter="url(#ds)">
    <rect x="178" y="138" width="156" height="236" rx="24" fill="#FBFDFC"/>
  </g>

  <!-- 文本行（玉色，呼应品牌强调色）-->
  <g fill="#2E7B71" fill-opacity="0.82">
    <rect x="208" y="182" width="96" height="16" rx="8"/>
    <rect x="208" y="218" width="96" height="13" rx="6.5"/>
    <rect x="208" y="246" width="68" height="13" rx="6.5"/>
  </g>
</svg>
